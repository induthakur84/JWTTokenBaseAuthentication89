<div class="container login-container">
  <div class="card">
    <h2>Login</h2>
    <p class="subtitle">Enter credentials to receive a JWT Token from .NET API</p>

    <!-- Error message -->
    @if (errorMessage) {
      <div class="alert alert-danger">{{ errorMessage }}</div>
    }

    <!-- Quick fill for classroom practical demo -->
    <div class="demo-buttons">
      <span>Demo Autofill:</span>
      <button type="button" (click)="fillDemo('Admin')" class="btn btn-sm btn-secondary">Admin</button>
      <button type="button" (click)="fillDemo('Employee')" class="btn btn-sm btn-secondary">Employee</button>
      <button type="button" (click)="fillDemo('User')" class="btn btn-sm btn-secondary">User</button>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Username</label>
        <input
          type="text"
          name="username"
          [(ngModel)]="credentials.username"
          class="form-control"
          placeholder="Enter username"
          required
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="credentials.password"
          class="form-control"
          placeholder="Enter password"
          required
        />
      </div>

      <button type="submit" [disabled]="isLoading" class="btn btn-primary btn-block">
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <div class="footer-link">
      Don't have an account? <a routerLink="/register">Register here</a>
    </div>
  </div>
</div>
